spring.application.name=kies

# Database config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kiesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kies}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kies}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JWT
app.jwt.secret=a2llc0FwcFNlY3JldEtleUZvckpXVFRoYXRJc1NhZmVBbmRTZWN1cmVBbmRMb25nRW5vdWdoVG9CZUJhc2U2NEVuY29kZWQ=
app.jwt.expiration-ms=86400000

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Upload de fichiers (images)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=uploads